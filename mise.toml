[tools]
node = "22"

[tasks.install]
description = "Install locked npm dependencies"
run = "npm ci"

[tasks.test]
description = "Run the test suite"
run = "npm test -- --run"

[tasks.dev]
description = "Start the development server"
run = "npm run dev"

[tasks.deploy]
description = "Deploy the production worker"
run = "npm run deploy-prod"

[tasks.types]
description = "Regenerate Cloudflare types"
run = "npm run cf-typegen"
